<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SAVE PEOPLE — an educational DNA matching demonstration for learning about DNA sequences, biotechnology, and science."><meta name="robots" content="index, follow"><title>SAVE PEOPLE - DNA Identification</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fb;color:#132238}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:#fff;border:1px solid #dce5ee;border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}.brand{display:flex;align-items:center;justify-content:center;gap:12px}.dna{width:52px;height:52px}.brand h1{margin:0;font-size:30px;line-height:1;color:#0c5b78}.brand small{display:block;margin-top:5px;color:#5b6b7c;font-weight:700;letter-spacing:.5px}.note{margin:18px auto 0;max-width:720px;color:#536273;line-height:1.55}.card{margin-top:18px;background:#fff;border:1px solid #dce5ee;border-radius:18px;padding:20px}.label{font-weight:700;margin-bottom:8px}.row{display:flex;gap:10px}.row input{flex:1;padding:14px 15px;border:1px solid #bfcbd7;border-radius:12px;font-size:16px}.btn{padding:14px 18px;border:0;border-radius:12px;background:#0c7aa1;color:#fff;font-weight:700;font-size:16px}.btn.secondary{background:#e8eef3;color:#16324a}.results{margin-top:18px}.result{padding:15px;border:1px solid #dce5ee;border-radius:14px;margin-top:10px}.ok{font-weight:700;color:#157347}.muted{color:#667788}.footer{margin:18px 0;text-align:center;color:#708090;font-size:13px}@media(max-width:600px){.row{flex-direction:column}.btn{width:100%}.brand h1{font-size:25px}}</style></head><body><div class="wrap"><section class="hero"><div class="brand"><svg class="dna" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M18 7c20 9 20 41 0 50M46 7C26 16 26 48 46 57" fill="none" stroke="#0c7aa1" stroke-width="5" stroke-linecap="round"/><path d="M22 16h20M19 25h26M19 39h26M22 48h20" stroke="#26a69a" stroke-width="4" stroke-linecap="round"/></svg><div><h1>SAVE PEOPLE</h1><small>DNA SCIENCE &amp; TECHNOLOGY</small></div></div><p class="note">Educational DNA sequence-matching demonstration. The example records below are fictional and intended for learning, not for real-world forensic or law-enforcement identification.</p></section><section class="card"><div class="label">Enter DNA sequence</div><div class="row"><input id="dnaInput" placeholder="Example: ATGCGTACGTTAGC" autocomplete="off"><button class="btn" onclick="matchDNA()">Search DNA</button><button class="btn secondary" onclick="clearDNA()">Clear</button></div><div id="results" class="results"></div></section><div class="footer">SAVE PEOPLE • Educational demo • Fictional data</div></div><script>const records=[{id:'SP-001',name:'Rahim Hasan',dna:'ATGCGTACGTTAGC'},{id:'SP-002',name:'Nabila Islam',dna:'CGTTAACCGGATCA'},{id:'SP-003',name:'Arif Hossain',dna:'GGAATTCGCTACGT'},{id:'SP-004',name:'Mitu Akter',dna:'TACGGCATTAACGG'},{id:'SP-005',name:'Samiul Karim',dna:'CCGTAATGCGATTA'}];function normalize(v){return v.toUpperCase().replace(/\s+/g,'')}function matchDNA(){const q=normalize(document.getElementById('dnaInput').value);const out=document.getElementById('results');if(!q){out.innerHTML='<div class="result muted">Please enter a DNA sequence.</div>';return}if(!/^[ATCG]+$/.test(q)){out.innerHTML='<div class="result muted">Use only A, T, C, and G.</div>';return}const found=records.filter(r=>r.dna===q);if(!found.length){out.innerHTML='<div class="result"><div class="muted">No exact match found in the fictional demo records.</div></div>';return}out.innerHTML=found.map(r=>`<div class="result"><div class="ok">Exact match found</div><div><strong>ID:</strong> ${r.id}</div><div><strong>Name:</strong> ${r.name}</div><div><strong>DNA:</strong> ${r.dna}</div></div>`).join('')}function clearDNA(){document.getElementById('dnaInput').value='';document.getElementById('results').innerHTML=''}document.getElementById('dnaInput').addEventListener('keydown',e=>{if(e.key==='Enter')matchDNA()});</script></body></html>
